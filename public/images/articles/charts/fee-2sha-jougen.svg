<svg xmlns="http://www.w3.org/2000/svg" width="460" height="536" viewBox="0 0 460 536" role="img" aria-labelledby="t d" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','YuGothic','Meiryo',sans-serif">
<title id="t">2社間手数料の上限を公開している会社</title>
<desc id="d">上限の率を表示（注記なし）12社、上限の率を表示（審査で超える場合の注記、「程度」などの表現、ページで異なる等）9社、一律の率（下限と上限が同じ）4社、下限のみ表示（上限の記載なし）17社、率を公表していない・個別査定11社、その他（一括申込サービス・2社間の手数料の記載なし）6社</desc>
